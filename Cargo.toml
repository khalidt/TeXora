[package]
name = "texora"
version = "1.6.1"
edition = "2021"
description = "TeXora: a LaTeX-native presenter for Beamer and PDF slides"
license = "PolyForm-Noncommercial-1.0.0"
build = "build.rs"

# macOS names the app's About, Hide and Quit items after this file, so it carries the real name.
[[bin]]
name = "TeXora"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "clipboard", "links", "system_fonts"] }
egui = "0.37"
pdfium-render = "0.9.5"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "tiff", "bmp", "webp"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
unicode-bidi = "0.3"
miniz_oxide = "0.8"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
display-info = "0.5"
dirs = "7"
# Video inside slides: GIFs are decoded by the image crate. TeXora contains no other video decoder;
# MP4 and other formats play through ffmpeg or VLC that the person installed (src/video.rs). md-5 names
# the posters.
md-5 = "0.11"
avif-decode = { version = "3", default-features = false }
jxl-oxide = { version = "0.12", default-features = false }

# Fonts for other writing systems (Arabic, Hebrew, Chinese, Japanese, Korean, Hindi, Thai...) come from
# the computer itself. On Linux, fontconfig is opened when the program runs instead of being linked, so
# the program starts even on a system without it, and the cross-build needs no fontconfig files.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# avif-decode, used without rav1d's assembly so AVIF decoding stays pure Rust (see the file's header).
[patch.crates-io]
avif-decode = { path = "crates/avif-decode" }
